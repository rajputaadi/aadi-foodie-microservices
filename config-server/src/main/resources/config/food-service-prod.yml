server:
  port: 9098
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/jb2404?createDatabaseIfNotExist=true
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

info:
  app:
    name: "Food Service"
    description: "This is Food Service. Ready to serve users. This configurations is located in config server"
    version: "1.0 Production"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true


management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true